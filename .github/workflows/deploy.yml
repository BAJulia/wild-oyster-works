# Builds the site and publishes it to GitHub Pages every time changes are pushed to main.
# It can also be run by hand from the repository's Actions tab ("Run workflow").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # The site is served from https://<user>.github.io/<repository-name>/
          BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub Pages shows 404.html for addresses it doesn't recognise (e.g. /gallery/blue-jay
      # when the page is refreshed). Making it a copy of the app lets the site handle those.
      - name: Support page refreshes on deep links
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
